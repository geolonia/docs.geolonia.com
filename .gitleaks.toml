# gitleaks の設定。既定のルールはそのまま使い、下の値だけを検出から外す。
[extend]
useDefault = true

[allowlist]
description = "ブラウザに配る前提の公開値。秘密ではない"
regexes = [
  # Mixpanel のプロジェクトトークン。app.geolonia.com と共通で、すべての
  # 訪問者のブラウザに配られる。できるのはイベントの書き込みだけで、
  # 集計データの読み出しには使えない。32桁の16進なので既定のルールが
  # 汎用の API キーとして拾ってしまう。
  '''012def15980f6899b0c457ea325bef5f''',
]
