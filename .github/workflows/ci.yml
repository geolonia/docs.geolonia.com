name: ci

# サイトがビルドでき、描画後のリンクが切れていないことを確かめる。
#
# リンクの検査を dist/ に対して行うのは、ソースを見ると2種類の誤りが起きるためである。
# 描画されないリンク（reference 配下に残る TypeDoc のパンくず）を不具合として数えて
# しまうことと、レイアウトが組み立てたリンク（サイドバー等）を見落とすことである。
# 詳しくは scripts/check-links.mjs のコメントを参照。

on:
  pull_request:
  push:
    branches: [main]

# 既定では書き込み権限まで付く。このワークフローは読むだけなので絞る。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false は、checkout が入れる認証情報を
      # ローカルの Git 設定に残さないため。npm ci は依存パッケージの
      # ライフサイクルスクリプトを走らせるので、残すとそこから
      # 認証済みの Git 操作ができてしまう。
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 文章の検査はビルドより速いので先に回す。
      # 対象は手書きページのみ。生成物の除外は .textlintignore にある。
      - name: 文章の検査
        run: npm run lint:text

      - name: ビルド
        run: npm run build

      - name: 内部リンクの検査
        run: npm run check:links
