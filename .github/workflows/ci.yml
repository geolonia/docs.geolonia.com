name: ci

# サイトがビルドでき、描画後のリンクが切れていないことを確かめる。
#
# リンクの検査を dist/ に対して行うのは、ソースを見ると2種類の誤りが起きるためである。
# 描画されないリンク（reference 配下に残る TypeDoc のパンくず）を不具合として数えて
# しまうことと、レイアウトが組み立てたリンク（サイドバー等）を見落とすことである。
# 詳しくは scripts/check-links.mjs のコメントを参照。

on:
  pull_request:
  push:
    # main-renewal-2026 は現在の本番配信元。main はカットオーバー後の配信元。
    # 切り替えの前後どちらでも走るように両方を挙げてある。
    # main-renewal-2026 を畳んだ時点で main だけにする。
    branches: [main, main-renewal-2026]

# 既定では書き込み権限まで付く。このワークフローは読むだけなので絞る。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false は、checkout が入れる認証情報を
      # ローカルの Git 設定に残さないため。npm ci は依存パッケージの
      # ライフサイクルスクリプトを走らせるので、残すとそこから
      # 認証済みの Git 操作ができてしまう。
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ビルド
        run: npm run build

      - name: 内部リンクの検査
        run: npm run check:links
